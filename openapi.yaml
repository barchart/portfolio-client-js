openapi: 3.0.1

info:
  title: Barchart Investor Portfolio API
  version: 8.0.3

components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authorization failure.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized

    SchemaError:
      description: Input invalid
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                value:
                  type: object
                  properties:
                    code:
                      type: string
                      example: SCHEMA_VALIDATION_FAILURE
                    message:
                      type: string
                      example: An attempt to read CREATE data failed (found \"timezone\" when expecting \"name\").
                children:
                  type: array
                  example: []
                  items: {}

    ServerError:
      description: Server error.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                value:
                  type: object
                  properties:
                    code:
                      type: string
                      example: REQUEST_GENERAL_FAILURE
                    message:
                      type: string
                      example: An attempt to create a portfolio failed for unspecified reason(s).
                children:
                  type: array
                  example: []
                  items: {}

  parameters:
    portfolio:
      name: portfolio
      in: path
      required: true
      description: The UUID of a portfolio.
      schema:
        type: string
        format: uuid
        example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3

    portfolio-or-wildcard:
      name: portfolio
      in: path
      required: true
      description: The UUID of a portfolio (or an asterisk for all portfolios).
      schema:
        type: string
        example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3

    position:
      name: position
      in: path
      required: true
      description: The UUID of a position.
      schema:
        type: string
        format: uuid
        example: 96af2dc6-2236-4a82-84c2-bff969389e00

    position-or-wildcard:
      name: position
      in: path
      required: true
      description: The UUID of a position (or an asterisk for all positions).
      schema:
        type: string
        example: 96af2dc6-2236-4a82-84c2-bff969389e00

    sequence:
      name: sequence
      in: path
      required: true
      description: The sequence number of the transaction.
      schema:
        type: number
        example: 1

    sequence-or-wildcard:
      name: sequence
      in: path
      required: true
      description: The sequence number of the transaction (or an asterisk for all transactions).
      schema:
        type: string
        example: '1'

  schemas:
    portfolio:
      type: object
      properties:
        user:
          type: string
          description: The identifier for the portfolio's owner.
          format: uuid
          example: ad4b0bd3-b5e1-4f7d-96b1-54d22d99960d
        portfolio:
          type: string
          description: The portfolio identifier (assigned by the backend).
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        name:
          type: string
          description: The name of the portfolio.
          example: My First Portfolio
        timezone:
          type: string
          description: The timezone of the portfolio. Must conform to a tz database name.
          format: tz_database_name
          example: America/New_York
        miscellany:
          type: string
          description: Miscellaneous JSON data regarding the portfolio.
          example: "{\"view\":\"portfolio\"}"
        dates:
          description: Important days and timestamps for the portfolio.
          allOf:
            - $ref: '#/components/schemas/portfolio-dates'
        defaults:
          description: Default settings for the portfolio.
          allOf:
            - $ref: '#/components/schemas/portfolio-defaults'
        legacy:
          description: Default settings for the portfolio.
          allOf:
            - $ref: '#/components/schemas/portfolio-legacy-data'
      required:
        - portfolio
        - user
        - name
        - timezone
        - defaults
        - legacy

    portfolio-create:
      type: object
      properties:
        name:
          type: string
          description: The name of the portfolio.
          example: My First Portfolio
        timezone:
          type: string
          description: The timezone of the portfolio. Must conform to a tz database name.
          format: tz_database_name
          example: America/New_York
        defaults:
          description: Default settings for the portfolio.
          allOf:
            - $ref: '#/components/schemas/portfolio-defaults'
      required:
        - name
        - timezone
        - defaults

    portfolio-update:
      type: object
      properties:
        portfolio:
          type: string
          description: The identifier of the portfolio to update.
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        timezone:
          type: string
          description: A new timezone for the portfolio.
          format: tz_database_name
          example: America/Chicago
        name:
          type: string
          description: A new name for the portfolio.
          example: My Other Portfolio
        defaults:
          description: New settings for the portfolio.
          allOf:
            - $ref: '#/components/schemas/portfolio-defaults-update'
      required:
        - portfolio

    portfolio-dates:
      type: object
      properties:
        create:
          type: string
          format: date
          description: The day the portfolio was created.
          example: 2026-06-04
        access:
          type: integer
          format: int64
          description: The timestamp (in milliseconds) when the portfolio was last accessed.
          example: 1780591608985
      required:
        - create
        - access

    portfolio-defaults:
      type: object
      properties:
        cash:
          type: boolean
          description: Controls whether cash transactions will be automatically be generated for investment transactions (e.g. will a cash DEBIT transaction be created when a stock BUY transaction is entered).
          example: true
        currency:
          description: The currency used for top-level summarization and reporting.
          allOf:
            - $ref: '#/components/schemas/enum-currency'
        reinvest:
          type: boolean
          description: Controls whether dividends will be automatically reinvested.
          example: true
        valuation:
          description: Determines the strategy for determining cost bases and gains.
          allOf:
            - $ref: '#/components/schemas/enum-position-valuation-type'
      required:
        - cash
        - currency
        - reinvest
        - valuation

    portfolio-defaults-update:
      type: object
      properties:
        cash:
          type: boolean
          description: Controls whether cash transactions will be automatically be generated for investment transactions (e.g. will a cash DEBIT transaction be created when a stock BUY transaction is entered).
          example: true
        currency:
          description: The currency used for top-level summarization and reporting.
          allOf:
            - $ref: '#/components/schemas/enum-currency'
        reinvest:
          type: boolean
          description: Controls whether dividends will be automatically reinvested.
          example: true
      required:
        - cash
        - currency
        - reinvest

    portfolio-legacy-data:
      type: object
      properties:
        system:
          type: string
          description: The name of the external system.
          example: BARCHART
        user:
          type: string
          description: The user identifier of the portfolio identifier in the external system.
          example: 340620
      required:
        - system
        - user

    position:
      type: object
      properties:
        user:
          type: string
          description: The identifier of the position's owner.
          format: uuid
          example: ad4b0bd3-b5e1-4f7d-96b1-54d22d99960d
        portfolio:
          type: string
          description: The identifier of the portfolio which contains the position.
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        instrument:
          description: The position's instrument.
          oneOf:
            - $ref: '#/components/schemas/position-instrument'
            - $ref: '#/components/schemas/position-instrument-equity-option'
            - $ref: '#/components/schemas/position-instrument-future'
            - $ref: '#/components/schemas/position-instrument-futures-option'
        position:
          type: string
          description: The identifier for the position.
          format: uuid
          example: 96af2dc6-2236-4a82-84c2-bff969389e00
        transaction:
          type: string
          description: The sequence number of the most recent transaction for the position.
          format: number
          example: 42
        cash:
          type: boolean
          description: Indicates if corresponding cash transactions should be created, when appropriate (e.g. also DEBIT cash when creating a BUY transaction for stock).
          example: true
        reinvest:
          type: boolean
          description: Indicates if dividends should be automatically reinvested.
          example: true
        valuation:
          description: The strategy for determining position cost basis and calculating gains and losses.
          allOf:
            - $ref: '#/components/schemas/enum-position-valuation-type'
        snapshot:
          description: Summary and performance information for the position, as of the last transaction.
          allOf:
            - $ref: '#/components/schemas/position-snapshot'
      required:
        - user
        - portfolio
        - instrument
        - position
        - transaction
        - cash
        - reinvest
        - snapshot

    position-update:
      type: object
      properties:
        portfolio:
          type: string
          description: The identifier of the portfolio containing the position to update.
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        position:
          type: string
          description: The identifier of the position to update.
          format: uuid
          example: 96af2dc6-2236-4a82-84c2-bff969389e00
        cash:
          type: boolean
          description: If present, changes the setting for automatic creation of the cash transactions (based on investment transactions).
          example: true
        reinvest:
          type: boolean
          description: If present, changes whether future dividends are re-invested.
          example: true
      required:
        - portfolio
        - position

    position-instrument:
      type: object
      properties:
        id:
          type: string
          description: The UUID of the the instrument.
          format: uuid
          example: c6471c5f-48d4-4979-8dd7-56c5ff1439c7
        name:
          type: string
          description: The name of the instrument.
          example: Apple Inc
        type:
          description: The asset class of the instrument.
          allOf:
            - $ref: '#/components/schemas/enum-instrument-type'
        code:
          description: The unit code of the instrument (if available).
          allOf:
            - $ref: '#/components/schemas/enum-instrument-unit-code'
        currency:
          description: The currency the instrument trades in.
          allOf:
            - $ref: '#/components/schemas/enum-currency'
        exchange:
          type: string
          description: The listing exchange of the instrument (if available)
          example: NASDAQ
        symbol:
          description: Symbol(s) used to identify the instrument.
          allOf:
            - $ref: '#/components/schemas/misc-symbols'
      required:
        - id
        - name
        - type
        - currency
        - symbol

    position-instrument-future:
      allOf:
        - $ref: '#/components/schemas/position-instrument'
        - $ref: '#/components/schemas/position-instrument-future-extension'

    position-instrument-future-extension:
      type: object
      properties:
        future:
          type: object
          properties:
            expiration:
              type: string
              format: date
              description: The day the futures contract expires.
              example: 2026-06-04
            tick:
              type: string
              description: The minimum tick increment for the futures contract.
              example: '0.25'
            value:
              type: string
              description: The value of a single tick.
              example: '12.5'
          required:
            - expiration
            - tick
            - value
      required:
        - future

    position-instrument-equity-option:
      allOf:
        - $ref: '#/components/schemas/position-instrument'
        - $ref: '#/components/schemas/position-instrument-equity-option-extension'

    position-instrument-equity-option-extension:
      type: object
      properties:
        option:
          type: object
          properties:
            expiration:
              type: string
              format: date
              description: The day the equity option contract expires.
              example: 2026-06-04
            side:
              description: The equity option type.
              allOf:
                - $ref: '#/components/schemas/enum-instrument-option-side'
            strike:
              type: string
              description: The strike price of the equity option contract.
              example: '112.5'
            multiplier:
              type: string
              description: The price multiplier of the equity option contract.
              example: '100'
          required:
            - expiration
            - side
            - strike
            - multiplier
      required:
        - option

    position-instrument-futures-option:
      allOf:
        - $ref: '#/components/schemas/position-instrument'
        - $ref: '#/components/schemas/position-instrument-futures-option-extension'

    position-instrument-futures-option-extension:
      type: object
      properties:
        option:
          type: object
          properties:
            expiration:
              type: string
              format: date
              description: The day the futures option contract expires.
              example: 2026-06-04
            side:
              description: The futures option type.
              allOf:
                - $ref: '#/components/schemas/enum-instrument-option-side'
            strike:
              type: string
              description: The strike price of the futures option contract.
              example: '7000'
            multiplier:
              type: string
              description: The price multiplier of the futures option contract.
              example: '1'
            tick:
              type: string
              description: The minimum tick increment for the underlying futures contract.
              example: '0.25'
            value:
              type: string
              description: The value of a single tick for the underlying futures contract.
              example: '12.5'
          required:
            - expiration
            - side
            - strike
            - multiplier
            - tick
            - value
      required:
        - option

    position-snapshot:
      type: object
      properties:
        date:
          type: string
          description: The date of the snapshot (YYYY-MM-DD).
          format: date
          example: '2022-01-13'
        open:
          type: string
          description: The number of shares (units) open (a decimal-formatted string, value may be negative).
          example: '100'
        direction:
          description: Qualifies the number of open shares as LONG (i.e. positive), short (i.e. negative), or EVEN (i.e. zero).
          allOf:
            - $ref: '#/components/schemas/enum-position-direction'
        buys:
          type: string
          description: The sum of all purchases in the currency of the underlying instrument (a decimal-formatted string, value is never negative).
          example: '-18256'
        sells:
          type: string
          description: The sum of all sales in the currency of the underlying instrument (a decimal-formatted string, value is never negative).
          example: '0'
        gain:
          type: string
          description: The realized gain on the position (a decimal-formatted string, value may be negative).
          example: '0'
        basis:
          type: string
          description: The amount invested in the remaining position (a decimal-formatted string, value may be negative).
          example: '0'
        income:
          type: string
          description: The sum of all income (e.g. dividends) earned on the position (a decimal-formatted string, value may be negative).
          example: '22'
        value:
          type: string
          description: The current value of the position (a decimal-formatted string, value is never negative). Valuation is based on the last transaction price (not the current market price).
          example: '18256'
        initial:
          description: The direction of the position immediately after it was opened.
          allOf:
            - $ref: '#/components/schemas/enum-position-direction'
      required:
        - date
        - open
        - direction
        - buys
        - sells
        - gain
        - basis
        - income
        - value
        - initial

    transaction:
      type: object
      properties:
        portfolio:
          type: string
          description: The identifier of the portfolio which contains the transaction.
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        position:
          type: string
          description: The identifier of the position which contains the transaction.
          format: uuid
          example: 96af2dc6-2236-4a82-84c2-bff969389e00
        transaction:
          type: string
          description: The identifier of the transaction.
          format: uuid
          example: b3bb28ee-a24c-4b8b-8b3b-8ad5b5b0b00a
        sequence:
          type: number
          description: The sequence number of the transaction (with respect to other transactions for the same position, starts with one).
          example: 1
        type:
          description: The type of transaction.
          allOf:
            - $ref: '#/components/schemas/enum-transaction-type'
        date:
          type: string
          description: The date of the transaction (YYYY-MM-DD).
          format: date
          example: '2020-08-30'
        description:
          type: string
          description: Autogenerated text describing the transaction (used for cash positions).
          example: Buy 100 AAPL
        amount:
          type: string
          description: The total amount of money affected by the transaction (decimal-formatted string). In cases where money was paid, the value is negative. In cases where money was received, the value is positive.
          example: '-18256'
        quantity:
          type: string
          description: The number of shares (or units) of the position's instrument affected by the transaction (decimal-formatted string). The value will be positive when purchasing and negative when selling.
          example: '100'
        fee:
          type: string
          description: A fee paid to execute the transaction (decimal-formatted string).
          example: '9.99'
        reference:
          description: A reference to another transaction — a transaction which caused this transaction to occur.
          allOf:
            - $ref: '#/components/schemas/transaction-reference'
        snapshot:
          description: A summary of the position size and performance, immediately after this transaction was executed.
          allOf:
            - $ref: '#/components/schemas/position-snapshot'
        trade:
          description: Additional information, only present if transaction is a trade (type is B, S, SS, etc).
          allOf:
            - $ref: '#/components/schemas/transaction-extension-for-trade'
        dividend:
          description: Additional information, only present if transaction is a dividend (type is DV, DX, DF, DY, etc).
          allOf:
            - $ref: '#/components/schemas/transaction-extension-for-dividend'
        split:
          description: Additional information, only present if transaction is a split (type is SP).
          allOf:
            - $ref: '#/components/schemas/transaction-extension-for-split'
      required:
        - portfolio
        - position
        - transaction
        - sequence
        - type
        - date
        - amount
        - quantity
        - snapshot

    transaction-reference:
      type: object
      properties:
        position:
          type: string
          description: The identifier of the referenced position.
          format: uuid
          example: 96af2dc6-2236-4a82-84c2-bff969389e00
        transaction:
          type: string
          description: The identifier of the referenced transaction.
          format: uuid
          example: b3bb28ee-a24c-4b8b-8b3b-8ad5b5b0b00a
      required:
        - position
        - transaction

    transaction-switch:
      allOf:
        - $ref: '#/components/schemas/transaction'
        - type: object
          properties:
            switch:
              description: The target transaction type when switching reinvestment strategy. The transaction's `type` property remains the current transaction type being switched.
              allOf:
                - $ref: '#/components/schemas/enum-transaction-type'
          required:
            - switch

    transaction-extension-for-trade:
      type: object
      properties:
        price:
          type: string
          description: The unit price the transaction was executed at (decimal-formatted string).
          example: '182.56'
      required:
        - price

    transaction-extension-for-dividend:
      type: object
      properties:
        rate:
          type: string
          description: The amount paid per unit (decimal-formatted string).
          example: '0.125'
        effective:
          type: string
          description: The day (YYYY-MM-DD) used to determine the quantity eligible to receive the dividend (i.e. the dividend ex-date).
          format: date
          example: '2020-08-30'
        price:
          type: string
          description: The market value of the underlying at the time the dividend was paid, used to calculate reinvestment quantities (decimal-formatted string).
          example: '499.23'
        amount:
          type: string
          description: The amount of the dividend (e.g the rate multiplied by the quantity eligible to receive the dividend, as a decimal-formatted string).
          example: '12.50'
      required:
        - rate
        - effective
        - amount

    transaction-extension-for-split:
      type: object
      properties:
        numerator:
          type: string
          description: The numerator in the following fraction [ shares owned after dividend ] / [ shares owned before dividend ] (decimal-formatted string).
          example: '4'
        denominator:
          type: string
          description: The denominator in the following fraction [ shares owned after dividend ] / [ shares owned before dividend ] (decimal-formatted string).
          example: '1'
        effective:
          type: string
          description: The day (YYYY-MM-DD) used to determine the quantity eligible to receive the dividend (i.e. the split ex-date).
          format: date
          example: '2020-08-30'
      required:
        - numerator
        - denominator
        - effective

    transaction-create:
      type: object
      properties:
        portfolio:
          type: string
          description: The portfolio identifier (assigned by the backend).
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        position:
          type: string
          description: The position identifier (or use \"new\" to create a new position).
          format: uuid
          example: 96af2dc6-2236-4a82-84c2-bff969389e00
        type:
          description: The type of transaction to create.
          allOf:
            - $ref: '#/components/schemas/enum-transaction-create-type'
        instrument:
          description: Information about the instrument (required when opening a new position, ignored otherwise).
          allOf:
            - $ref: '#/components/schemas/transaction-create-instrument'
        date:
          type: string
          description: The day of the transaction (YYYY-MM-DD).
          format: date
          example: '2022-01-13'
        price:
          type: string
          description: The unit price of the instrument at the time the transaction executes (decimal-formatted string).
          example: '123.45'
        quantity:
          type: string
          description: The number of units affected by the transaction (decimal-formatted string).
          example: '100'
        fee:
          type: string
          description: A fee paid to execute the transaction (decimal-formatted string).
          example: '9.99'
      required:
        - portfolio
        - position
        - type
        - date
        - quantity

    transaction-create-instrument:
      type: object
      properties:
        symbol:
          description: Symbols used to identify the target instrument.
          allOf:
            - $ref: '#/components/schemas/misc-symbols'
      required:
        - symbol

    transaction-mutate-result:
      type: object
      properties:
        positions:
          description: Positions which were affected by a transaction (create, update, or delete) operation.
          allOf:
            - $ref: '#/components/schemas/transaction-mutate-result-positions'
        summaries:
          description: Positions summaries for any positions that were created or updated.
          allOf:
            - $ref: '#/components/schemas/position-summary'
      required:
        - positions

    transaction-mutate-result-positions:
      type: object
      properties:
        saved:
          type: array
          description: All positions which were created or updated.
          items:
            $ref: '#/components/schemas/position'
        deleted:
          type: array
          description: All positions which were deleted.
          items:
            $ref: '#/components/schemas/position'
      required:
        - saved
        - deleted

    misc-symbols:
      type: object
      properties:
        barchart:
          type: string
          description: The symbol used by Barchart (required to lookup quotes and determine prices).
          example: AAPL
        display:
          type: string
          description: The symbol used for display purposes (often the same as the Barchart symbol).
          example: AAPL
      required:
        - barchart

    misc-valuation-container:
      type: object
      properties:
        user:
          type: string
          description: The UUID of a user.
          format: uuid
          example: ad4b0bd3-b5e1-4f7d-96b1-54d22d99960d
        portfolio:
          type: string
          description: The UUID of a portfolio (asterisk for the all portfolios).
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        position:
          type: string
          description: The UUID of a position (asterisk for the all positions).
          format: uuid
          example: 96af2dc6-2236-4a82-84c2-bff969389e00
        currency:
          description: The currency of the valuations (absent when no valuations are available).
          allOf:
            - $ref: '#/components/schemas/enum-currency'
        valuations:
          type: array
          description: Daily valuations for the position (or the entire portfolio).
          items:
            $ref: '#/components/schemas/misc-valuation'
      required:
        - user
        - portfolio
        - position
        - valuations

    misc-valuation:
      type: object
      properties:
        date:
          type: string
          description: The date of the valuation (YYYY-MM-DD).
          format: date
          example: '2020-08-30'
        market:
          type: number
          description: The market value of the position (or portfolio).
          example: 20924.08
      required:
        - date
        - market


    misc-valuation-currency-update:
      type: object
      description: Object used to request update of currency used for valuations.
      properties:
        currency:
          description: The currency code used for the recalculation.
          allOf:
            - $ref: '#/components/schemas/enum-currency'
      required:
        - currency

    misc-valuation-currency-update-result:
      type: object
      description: Result of a values currency recalculation request.
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful.
          example: true
      required:
        - success

    enum-currency:
      type: string
      description: Currencies used to trade and value instruments and positions.
      enum:
        - USD
        - CAD

    enum-instrument-type:
      type: string
      description: Codes which define asset classes for instruments.
      enum:
        - CASH
        - CRYPTO
        - EQUITY
        - EQUITY_OPTION
        - FUND
        - FUTURE
        - FUTURE_OPTION
        - OTHER

    enum-instrument-unit-code:
      type: string
      description: Codes which define price formatting rules for instruments.
      enum:
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        - '7'
        - '8'
        - '9'
        - A
        - B
        - C
        - D
        - E
        - F

    enum-instrument-option-side:
      type: string
      description: Indicates the option type
      enum:
        - CALL
        - PUT

    enum-position-direction:
      type: string
      description: Codes which describe position size — positive values are LONG, negative values are SHORT and zero values are EVEN.
      enum:
        - LONG
        - SHORT
        - EVEN

    enum-position-valuation-type:
      type: string
      description: Codes used to define strategies for position valuation.
      enum:
        - AVG

    enum-transaction-type:
      type: string
      description: Single letter codes for transaction types (e.g. B for BUY, S for SELL; see \"Appendices > Enumerations\" in SDK documentation for more info), including types which are managed by the backend (e.g. DV for dividend).
      enum:
        - B
        - S
        - BS
        - SS
        - DV
        - DX
        - DS
        - SP
        - F
        - FU
        - DL
        - MC
        - MO
        - SPF
        - SPFO
        - DC
        - DY
        - DF
        - D
        - W
        - DR
        - CR
        - V
        - I

    enum-transaction-create-type:
      type: string
      description: Single letter codes for transaction types (e.g. B for BUY, S for SELL; see \"Appendices > Enumerations\" in SDK documentation for more info) which can be created by a consumer (this is a subset of the  "enum-transaction-type" component).
      enum:
        - B
        - S
        - BS
        - SS
        - F
        - D
        - W
        - V
        - I

    service-metadata:
      type: object
      properties:
        version:
          type: string
          example: 8.0.3
        environment:
          type: string
          example: www-prod

    instrument-resolution:
      type: object
      description: The instrument identifier for a symbol on a given day.
      properties:
        symbol:
          type: string
          description: The symbol that instrument resolution was attempted for.
          example: AAPL
        day:
          type: string
          description: The day on which instrument resolution was attempted.
          format: date
          example: '2026-05-28'
        instrument:
          type: string
          description: The identifier of the instrument with the specified symbol on the specified day (or null).
          nullable: true
          format: uuid
          example: c6471c5f-48d4-4979-8dd7-56c5ff1439c7
      required:
        - symbol
        - day
        - instrument

    position-summary:
      type: object
      properties:
        user:
          type: string
          format: uuid
          example: 01748dd1-5d6d-4ae4-91b0-4e39e80c2b35
        portfolio:
          type: string
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        position:
          type: string
          format: uuid
          example: 96af2dc6-2236-4a82-84c2-bff969389e00
        frame:
          $ref: '#/components/schemas/enum-position-summary-frame'
        start:
          $ref: '#/components/schemas/position-summary-point'
        end:
          $ref: '#/components/schemas/position-summary-point'
        period:
          $ref: '#/components/schemas/position-summary-period'
      required:
        - user
        - portfolio
        - position
        - frame
        - start
        - end
        - period

    position-summary-point:
      type: object
      properties:
        date:
          type: string
          format: date
          example: '2026-05-28'
        sequence:
          type: number
          example: 42
        open:
          type: string
          example: '100'
        direction:
          $ref: '#/components/schemas/enum-position-direction'
        basis:
          type: string
          example: '18256'
        value:
          type: string
          example: '19100'

    position-summary-period:
      type: object
      properties:
        buys:
          type: string
          example: '18256'
        sells:
          type: string
          example: '0'
        income:
          type: string
          example: '22'
        realized:
          type: string
          example: '0'
        unrealized:
          type: string
          example: '844'

    valuations-availability-result:
      type: object
      description: Availability of valuation data for a portfolio and its positions.
      properties:
        available:
          type: boolean
          description: If true, all position and portfolio valuations are up-to-date.
          example: false
        positions:
          type: array
          description: Position identifiers for valuations currently being calculated. An empty array indicates all position valuations are up-to-date.
          items:
            type: string
            format: uuid
            example: 96af2dc6-2236-4a82-84c2-bff969389e00
      required:
        - available

    snaptrade-brokerage:
      type: object
      description: SnapTrade brokerage and linked account metadata.
      properties:
        id:
          type: string
          description: The SnapTrade identifier for the brokerage.
          example: 0c1fc39b-0865-4ee2-bd21-551e9f9f866a
        name:
          type: string
          description: The SnapTrade code for the brokerage.
          example: COINBASE
        display:
          type: string
          description: The SnapTrade name for the brokerage (for display purposes).
          example: Coinbase
        logo:
          type: string
          description: The URI for the brokerage's logo image.
          format: uri
          example: https://passiv-brokerage-logos.s3.ca-central-1.amazonaws.com/coinbase-logo-square.jpg
        connection:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/snaptrade-connection'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/snaptrade-account'
      required:
        - id
        - name
        - display
        - logo
        - connection
        - accounts

    snaptrade-connect-instructions:
      type: object
      description: Instructions for connecting to a brokerage.
      properties:
        success:
          type: boolean
          description: The success of the operation.
          example: true
        uri:
          type: string
          description: The URI for brokerage authentication.
          format: uri
          example: https://app.snaptrade.com/snapTrade/redeemToken?token=7j1kFBUasV6LcKV6dexnc
      required:
        - success
        - uri

    snaptrade-connection:
      type: object
      description: Data related to a user's connection to a brokerage.
      properties:
        id:
          type: string
          description: The SnapTrade identifier for the user's connection to the brokerage.
          example: 147e7af9-f2fd-4e1d-b0c2-05059f03db89
        broken:
          type: boolean
          description: Indicates if the authentication for the connection has expired.
          example: false
      required:
        - id
        - broken

    snaptrade-account:
      type: object
      description: Data related to a real-world brokerage account.
      properties:
        id:
          type: string
          description: The SnapTrade identifier for the brokerage account.
          example: ccf4c0e4-50e1-428b-9865-0d85f82256d4
        number:
          type: string
          description: The brokerage account number, masked for display.
          example: 'XXXXXXD4FE'
        name:
          type: string
          description: The brokerage account name.
          example: My Coinbase Account
        link:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/snaptrade-link'
      required:
        - id
        - number
        - name
        - type
        - link

    snaptrade-link:
      type: object
      description: The linkage between a SnapTrade account and a portfolio.
      properties:
        portfolio:
          type: string
          description: The UUID of the linked portfolio.
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        status:
          description: The status of the link between the SnapTrade account and the portfolio.
          allOf:
            - $ref: '#/components/schemas/enum-snaptrade-link-status'
        progress:
          type: number
          description: Percentage completion for the current status.
          example: 100
        advice:
          type: string
          description: Additional information about the current status.
          example: Account linking complete.
        timestamp:
          type: number
          description: The timestamp of the most recent status update.
          format: int64
          example: 1780878364743
      required:
        - status
        - progress
        - timestamp

    snaptrade-link-snapshot:
      type: object
      description: The linkage between a SnapTrade account and a portfolio.
      properties:
        user:
          type: string
          description: The UUID of the authorized user.
          example: 01748dd1-5d6d-4ae4-91b0-4e39e80c2b35
        portfolio:
          type: string
          description: The UUID of the linked portfolio.
          format: uuid
          example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
        connection:
          type: string
          description: The SnapTrade identifier for the brokerage connection.
          example: 147e7af9-f2fd-4e1d-b0c2-05059f03db89
        account:
          type: string
          description: The SnapTrade identifier for the brokerage account.
          example: ccf4c0e4-50e1-428b-9865-0d85f82256d4
        status:
          description: The status of the link between the SnapTrade account and the portfolio.
          allOf:
            - $ref: '#/components/schemas/enum-snaptrade-link-status'
        progress:
          type: number
          description: Percentage completion for the current status.
          example: 100
        timestamp:
          type: number
          description: The timestamp of the most recent status update.
          format: int64
          example: 1780878364743
        advice:
          type: string
          description: Additional information about the current status.
          example: Account linking complete.
      required:
        - user
        - portfolio
        - connection
        - account
        - status
        - progress

    snaptrade-linking-report:
      type: object
      description: Data returned by a SnapTrade linking operation which could add or remove portfolios.
      properties:
        brokerages:
          type: array
          description: SnapTrade brokerages and linked account metadata.
          items:
            $ref: '#/components/schemas/snaptrade-brokerage'
        portfolios:
          type: object
          description: Portfolios saved or deleted by the linking operation.
          properties:
            saved:
              type: array
              description: Portfolios created or updated by the linking operation.
              items:
                $ref: '#/components/schemas/portfolio'
            deleted:
              type: array
              description: Portfolios deleted by the linking operation.
              items:
                $ref: '#/components/schemas/portfolio'
          required:
            - saved
            - deleted
      required:
        - brokerages
        - portfolios

    enum-position-summary-frame:
      type: string
      enum:
        - YEARLY
        - QUARTERLY
        - MONTHLY
        - YTD

    enum-snaptrade-link-mode:
      type: string
      enum:
        - STANDARD
        - LIMITED

    enum-snaptrade-link-status:
      type: string
      enum:
        - WAITING
        - LINKING
        - LINKED
        - REFRESHING
        - FAILED

servers:
  - url: https://portfolio-www-stage.aws.barchart.com/v1
  - url: https://portfolio-www-prod.aws.barchart.com/v1

tags:
  - name: Instruments
  - name: Portfolios
  - name: Positions
  - name: Position Summaries
  - name: Position Values
  - name: SnapTrade Integration
  - name: Service

paths:
  /instruments/{symbol}:
    get:
      summary: Retrieves an instrument identifier.
      description: Retrieves the instrument identifier for a symbol on a given day.
      tags:
        - Instruments
      security:
        - JWT: []
      parameters:
        - name: symbol
          in: path
          required: true
          description: The symbol of the instrument.
          schema:
            type: string
            example: AAPL
        - name: day
          in: query
          required: false
          description: The day on which to resolve the instrument (today, if not provided).
          schema:
            type: string
            format: date
            example: '2026-05-28'
      responses:
        '200':
          description: Instrument resolution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/instrument-resolution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /portfolios:
    post:
      summary: Creates a new portfolio.
      description: Creates a new portfolio.
      tags:
        - Portfolios
      security:
        - JWT: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/portfolio-create'
      responses:
        '200':
          description: The newly created portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portfolio'
        '400':
          $ref: '#/components/responses/SchemaError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /portfolios/{portfolio}:
    get:
      summary: Retrieves portfolio(s).
      description: Retrieves portfolio(s).
      tags:
        - Portfolios
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio-or-wildcard'
      responses:
        '200':
          description: An array of portfolios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/portfolio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Updates a portfolio.
      description: Updates a portfolio.
      tags:
        - Portfolios
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/portfolio-update'
      responses:
        '200':
          description: The updated portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portfolio'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Deletes a portfolio.
      description: Deletes a portfolio and all associated entities — including positions, transactions, summaries, and valuations.
      tags:
        - Portfolios
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio'
      responses:
        '200':
          description: Deletion of portfolio successful. No data is returned.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /portfolios/{portfolio}/positions/{position}:
    get:
      summary: Retrieves position(s).
      description: Retrieves position(s).
      tags:
        - Positions
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio-or-wildcard'
        - $ref: '#/components/parameters/position-or-wildcard'
        - name: symbol
          in: query
          required: false
          description: If specified, only positions for a given symbol are returned.
          schema:
            type: string
            example: AAPL
      responses:
        '200':
          description: An array of positions (with zero, one, or many items).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/position'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Updates a position.
      description: Updates settings for a position (e.g. turn on automatic re-investment).
      tags:
        - Positions
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio'
        - $ref: '#/components/parameters/position'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/position-update'
      responses:
        '200':
          description: Positions affected by the update operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction-mutate-result'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Deletes a position.
      description: Deletes a position and all associated entities — including transactions, summaries, and valuations.
      tags:
        - Positions
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio'
        - $ref: '#/components/parameters/position'
      responses:
        '200':
          description: Positions affected by the delete operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction-mutate-result'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      summary: Moves a position.
      description: Moves a position into another portfolio.
      tags:
        - Positions
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio'
        - $ref: '#/components/parameters/position'
        - name: target
          in: query
          required: true
          description: The identifier of the destination portfolio.
          schema:
            type: string
            format: uuid
            example: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
      responses:
        '200':
          description: Positions affected by the move operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction-mutate-result'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /portfolios/{portfolio}/summaries/{position}:
    get:
      summary: Retrieves position summaries.
      description: Retrieves position summaries.
      tags:
        - Position Summaries
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio-or-wildcard'
        - $ref: '#/components/parameters/position-or-wildcard'
        - name: frames
          in: query
          required: false
          description: Comma-separated summary frame codes.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/enum-position-summary-frame'
        - name: periods
          in: query
          required: false
          description: Number of periods to retrieve.
          schema:
            type: number
            example: 4
        - name: start
          in: query
          required: false
          description: First summary start date to retrieve.
          schema:
            type: string
            format: date
            example: '2026-01-01'
      responses:
        '200':
          description: An array of position summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/position-summary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /portfolios/{portfolio}/positions/{position}/transactions:
    post:
      summary: Creates a new transaction.
      description: Creates a new transaction for the current user.
      tags:
        - Transactions
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio'
        - name: position
          in: path
          required: true
          description: The identifier of the position to which the transaction will be added. Use "new" to create a new position.
          schema:
            type: string
            example: 96af2dc6-2236-4a82-84c2-bff969389e00
        - name: type
          in: query
          required: true
          description: The type of transaction to create.
          schema:
            $ref: '#/components/schemas/enum-transaction-create-type'
        - name: suppressCorporateActions
          in: query
          required: false
          description: If true, suppresses generated corporate action transactions.
          schema:
            type: boolean
            example: false
        - name: strictInstrumentResolution
          in: query
          required: false
          description: If true, requires strict instrument resolution.
          schema:
            type: boolean
            example: true
        - name: correctInvalidTicks
          in: query
          required: false
          description: If true, corrects invalid tick data during transaction processing.
          schema:
            type: boolean
            example: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transaction-create'
      responses:
        '200':
          description: An object listing the positions affected by the new transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction-mutate-result'
        '400':
          $ref: '#/components/responses/SchemaError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /portfolios/{portfolio}/positions/{position}/transactions/{sequence}:
    get:
      summary: Returns one or more transactions.
      description: Returns one transaction by sequence number, or all transactions when sequence is an asterisk (*).
      tags:
        - Transactions
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio'
        - $ref: '#/components/parameters/position-or-wildcard'
        - $ref: '#/components/parameters/sequence-or-wildcard'
      responses:
        '200':
          description: An array of transactions (with zero, one, or many items).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/transaction'
        '400':
          $ref: '#/components/responses/SchemaError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Edits or switches a transaction.
      description: Edits a transaction, or switches the reinvestment strategy when the `switch` query parameter is supplied. Use `type` when editing a transaction, or `switch` when changing reinvestment strategy. Do not send both query parameters in the same request. In switch mode, the body `type` is the current transaction type and `switch` is the target transaction type.
      tags:
        - Transactions
      security:
        - JWT: []
      parameters:
        - $ref: '#/components/parameters/portfolio'
        - $ref: '#/components/parameters/position'
        - $ref: '#/components/parameters/sequence'
        - name: type
          in: query
          required: false
          description: The transaction type to use when editing the transaction. Use this for the edit transaction mode.
          schema:
            $ref: '#/components/schemas/enum-transaction-type'
          examples:
            editTransaction:
              summary: Edit transaction type.
              value: B
        - name: switch
          in: query
          required: false
          description: The target transaction type when switching reinvestment strategy. Use this for the switch reinvestment strategy mode.
          schema:
            $ref: '#/components/schemas/enum-transaction-type'
          examples:
            switchReinvestmentStrategy:
              summary: Switch reinvestment strategy.
              value: DX
      requestBody:
        description: Transaction payload for the edit transaction or switch reinvestment strategy operation. In switch mode, include the current transaction payload and the target `switch` transaction type.
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/transaction'
                - $ref: '#/components/schemas/transaction-switch'
            examples:
              editTransaction:
                summary: Edit a buy transaction.
                value:
                  portfolio: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
                  position: 96af2dc6-2236-4a82-84c2-bff969389e00
                  transaction: b3bb28ee-a24c-4b8b-8b3b-8ad5b5b0b00a
                  sequence: 1
                  type: B
                  date: '2026-05-28'
                  amount: '-18256'
                  quantity: '100'
                  fee: '9.99'
                  snapshot:
                    date: '2026-05-28'
                    open: '100'
                    direction: LONG
                    buys: '-18256'
                    sells: '0'
                    gain: '0'
                    basis: '18256'
                    income: '0'
                    value: '18256'
              switchReinvestmentStrategy:
                summary: Switch dividend reinvestment strategy.
                value:
                  portfolio: 6ce12dec-bba9-4bf3-b865-8a4eab6e43a3
                  position: 96af2dc6-2236-4a82-84c2-bff969389e00
                  transaction: b3bb28ee-a24c-4b8b-8b3b-8ad5b5b0b00a
                  sequence: 12
                  type: DV
                  switch: DX
